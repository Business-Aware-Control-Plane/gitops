apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: rideshare
  source:
    repoURL: 'https://kedacore.github.io/charts'
    chart: keda
    # Verified against the live chart index 2026-09-28 (helm search repo
    # kedacore/keda --versions) — 2.21.0 was the latest stable release.
    targetRevision: 2.21.0
    helm:
      values: |
        resources:
          operator:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: 500m
              memory: 500Mi
        prometheus:
          metricServer:
            enabled: false
          operator:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
