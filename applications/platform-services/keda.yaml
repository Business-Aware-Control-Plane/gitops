apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: rideshare
  source:
    repoURL: 'https://kedacore.github.io/charts'
    chart: keda
    # TODO(INFRA-HB-01 §06 step 5): pin to the actual latest stable release —
    # `helm search repo kedacore/keda --versions` or the KEDA GitHub releases
    # page — before first sync. Bash was down when this file was written, so
    # this could not be verified against the live chart index.
    targetRevision: 2.16.0
    helm:
      values: |
        resources:
          operator:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: 500m
              memory: 500Mi
        prometheus:
          metricServer:
            enabled: false
          operator:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
