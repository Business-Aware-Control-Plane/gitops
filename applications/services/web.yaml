apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web
  namespace: argocd
spec:
  project: rideshare
  source:
    repoURL: 'https://github.com/Business-Aware-Control-Plane/gitops.git'
    targetRevision: HEAD
    path: charts/rideshare-service
    helm:
      valueFiles:
        - ../../clusters/development/values/applications/web.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: rideshare
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    createNamespace: true
