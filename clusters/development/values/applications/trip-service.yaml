replicaCount: 1

image:
  repository: ride-sharing/trip-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9093

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

config:
  JAEGER_ENDPOINT: "http://jaeger.observability.svc.cluster.local:4318/v1/traces"

env:
  - name: MONGODB_URI
    valueFrom:
      secretKeyRef:
        name: mongodb
        key: uri
  - name: RABBITMQ_URI
    valueFrom:
      secretKeyRef:
        name: rabbitmq-credentials
        key: uri
  - name: JAEGER_ENDPOINT
    valueFrom:
      configMapKeyRef:
        name: trip-service-config
        key: JAEGER_ENDPOINT
