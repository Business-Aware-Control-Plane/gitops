replicaCount: 1
image:
  repository: shakthirw/trip-service
  tag: e54acc040431bb8abc23713f6fe05a21186090a5
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 9093
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
config:
  JAEGER_ENDPOINT: "http://jaeger.observability.svc.cluster.local:4318/v1/traces"
env:
  - name: POSTGRES_URI
    valueFrom:
      secretKeyRef:
        name: postgres-cluster-app
        key: uri
  - name: RABBITMQ_URI
    valueFrom:
      secretKeyRef:
        name: rabbitmq-credentials
        key: uri
  - name: JAEGER_ENDPOINT
    valueFrom:
      configMapKeyRef:
        name: trip-service-config
        key: JAEGER_ENDPOINT
