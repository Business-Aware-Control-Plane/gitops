replicaCount: 1

image:
  repository: ride-sharing/api-gateway
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 8081

resources:
  requests:
    cpu: 125m
    memory: 128Mi
  limits:
    cpu: 125m
    memory: 128Mi

config:
  GATEWAY_HTTP_ADDR: ":8081"
  JAEGER_ENDPOINT: "http://jaeger.observability.svc.cluster.local:4318/v1/traces"

env:
  - name: GATEWAY_HTTP_ADDR
    valueFrom:
      configMapKeyRef:
        name: api-gateway-config
        key: GATEWAY_HTTP_ADDR
  - name: JAEGER_ENDPOINT
    valueFrom:
      configMapKeyRef:
        name: api-gateway-config
        key: JAEGER_ENDPOINT
  - name: RABBITMQ_URI
    valueFrom:
      secretKeyRef:
        name: rabbitmq-credentials
        key: uri
  - name: STRIPE_WEBHOOK_KEY
    valueFrom:
      secretKeyRef:
        name: stripe-secrets
        key: stripe-webhook-key
