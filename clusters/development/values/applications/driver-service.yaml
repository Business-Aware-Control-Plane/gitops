replicaCount: 1
image:
  repository: shakthirw/driver-service
  tag: 21e846726bf538d5cafde11115385a631b5775d7
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 9092
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
config:
  JAEGER_ENDPOINT: "http://jaeger.observability.svc.cluster.local:4318/v1/traces"
  REDIS_ADDR: "redis.platform.svc.cluster.local:6379"
env:
  - name: RABBITMQ_URI
    valueFrom:
      secretKeyRef:
        name: rabbitmq-credentials
        key: uri
  - name: JAEGER_ENDPOINT
    valueFrom:
      configMapKeyRef:
        name: driver-service-config
        key: JAEGER_ENDPOINT
  - name: REDIS_ADDR
    valueFrom:
      configMapKeyRef:
        name: driver-service-config
        key: REDIS_ADDR
