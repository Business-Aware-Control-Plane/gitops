replicaCount: 1
image:
  repository: shakthirw/web
  tag: e54acc040431bb8abc23713f6fe05a21186090a5
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 3000
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
env:
  - name: NODE_ENV
    value: "development"
  - name: NEXT_PUBLIC_API_URL
    value: "http://api-gateway.rideshare:8080"
  - name: NEXT_PUBLIC_WEBSOCKET_URL
    value: "ws://api-gateway.rideshare:8080/ws"
  - name: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    value: "pk_test_51TsQEZPhlSJG365Uy2n6nNnNffe3Ti90wYT1T19rJPQXEYvoJPqprYpIBV3wUXZpamcGq2BaiYpJ20kw2NfJGfve007bNk8RCx"
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 60
  periodSeconds: 20
  timeoutSeconds: 10
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3
ingress:
  className: nginx
  hosts:
    - host: web.rideshare
      paths:
        - path: /
          pathType: Prefix
