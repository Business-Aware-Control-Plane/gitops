replicaCount: 1
image:
  repository: shakthirw/web
  tag: 21e846726bf538d5cafde11115385a631b5775d7
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 3000
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
env:
  - name: NODE_ENV
    value: "development"
  - name: NEXT_PUBLIC_API_URL
    value: "http://api-gateway.rideshare:8080"
  - name: NEXT_PUBLIC_WEBSOCKET_URL
    value: "ws://api-gateway.rideshare:8080/ws"
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 60
  periodSeconds: 20
  timeoutSeconds: 10
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3
ingress:
  className: nginx
  hosts:
    - host: web.rideshare
      paths:
        - path: /
          pathType: Prefix
