      project: rideshare
      source:
        repoURL: '{{REPO_URL}}'
        targetRevision: HEAD
        path: charts/jaeger
        helm:
          valueFiles:
            - clusters/development/values/observability/jaeger.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: observability-dev
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        createNamespace: true

  # ============================================================
  # Application Layer (All utilizing the shared rideshare-service chart)
  # ============================================================
