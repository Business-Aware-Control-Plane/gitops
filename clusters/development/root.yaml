        repoURL: '{{REPO_URL}}'
        targetRevision: HEAD
        path: charts/rideshare-service
        helm:
          valueFiles:
            - clusters/development/values/applications/api-gateway.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: rideshare-dev
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        createNamespace: true

