apiVersion: v1
kind: List
items:
  # ============================================================
  # Platform Layer
  # ============================================================
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: dev-rabbitmq
      namespace: argocd
    spec:
      project: rideshare
      source:
        repoURL: '{{REPO_URL}}'
        targetRevision: HEAD
        path: charts/rabbitmq
        helm:
          valueFiles:
            - clusters/development/values/platform/rabbitmq.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: platform-dev
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        createNamespace: true

  # ============================================================
  # Observability Layer
  # ============================================================
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: dev-jaeger
      namespace: argocd
