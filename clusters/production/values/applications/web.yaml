replicaCount: 2
image:
  repository: shakthirw/web
  tag: "e54acc040431bb8abc23713f6fe05a21186090a5"
  pullPolicy: Always
service:
  type: ClusterIP
  port: 3000
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi
env:
  - name: NODE_ENV
    value: "production"
  - name: NEXT_PUBLIC_API_URL
    value: "https://api.{{DOMAIN}}"
  - name: NEXT_PUBLIC_WEBSOCKET_URL
    value: "wss://api.{{DOMAIN}}/ws"
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 60
  periodSeconds: 20
  timeoutSeconds: 10
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3
