replicaCount: 2
image:
  repository: shakthirw/web
  tag: "21e846726bf538d5cafde11115385a631b5775d7"
  pullPolicy: Always
service:
  type: ClusterIP
  port: 3000
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi
env:
  - name: NODE_ENV
    value: "production"
  - name: NEXT_PUBLIC_API_URL
    value: "https://api.{{DOMAIN}}"
  - name: NEXT_PUBLIC_WEBSOCKET_URL
    value: "wss://api.{{DOMAIN}}/ws"
  - name: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    value: "pk_test_51TsQEZPhlSJG365Uy2n6nNnNffe3Ti90wYT1T19rJPQXEYvoJPqprYpIBV3wUXZpamcGq2BaiYpJ20kw2NfJGfve007bNk8RCx"
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 60
  periodSeconds: 20
  timeoutSeconds: 10
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3
