replicaCount: 2
image:
  repository: shakthirw/trip-service
  tag: "21e846726bf538d5cafde11115385a631b5775d7"
  pullPolicy: Always
service:
  type: ClusterIP
  port: 9093
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
env:
  - name: POSTGRES_URI
    valueFrom:
      secretKeyRef:
        name: postgres-cluster-app
        key: uri
  - name: RABBITMQ_URI
    valueFrom:
      secretKeyRef:
        name: rabbitmq-credentials
        key: uri
