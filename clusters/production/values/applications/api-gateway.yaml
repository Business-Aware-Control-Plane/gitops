replicaCount: 2
image:
  repository: shakthirw/api-gateway
  tag: "e54acc040431bb8abc23713f6fe05a21186090a5"
  pullPolicy: Always
service:
  type: LoadBalancer
  port: 8081
resources:
  requests:
    cpu: 125m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
config:
  GATEWAY_HTTP_ADDR: ":8081"
env:
  - name: GATEWAY_HTTP_ADDR
    valueFrom:
      configMapKeyRef:
        name: api-gateway-config
        key: GATEWAY_HTTP_ADDR
  - name: RABBITMQ_URI
    valueFrom:
      secretKeyRef:
        name: rabbitmq-credentials
        key: uri
  - name: STRIPE_WEBHOOK_KEY
    valueFrom:
      secretKeyRef:
        name: stripe-secrets
        key: stripe-webhook-key
