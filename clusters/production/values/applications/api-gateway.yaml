replicaCount: 2

image:
  repository: europe-west1-docker.pkg.dev/{{PROJECT_ID}}/ride-sharing/api-gateway
  tag: "1.0.0+f8b21e4"
  pullPolicy: Always

service:
  type: LoadBalancer
  port: 8081

resources:
  requests:
    cpu: 125m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

config:
  GATEWAY_HTTP_ADDR: ":8081"

env:
  - name: GATEWAY_HTTP_ADDR
    valueFrom:
      configMapKeyRef:
        name: api-gateway-config
        key: GATEWAY_HTTP_ADDR
  - name: RABBITMQ_URI
    valueFrom:
      secretKeyRef:
        name: rabbitmq-credentials
        key: uri
  - name: STRIPE_WEBHOOK_KEY
    valueFrom:
      secretKeyRef:
        name: stripe-secrets
        key: stripe-webhook-key
