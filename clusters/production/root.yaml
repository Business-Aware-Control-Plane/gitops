        createNamespace: true

  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: prod-payment-service
      namespace: argocd
    spec:
      project: rideshare
      source:
        repoURL: '{{REPO_URL}}'
        targetRevision: HEAD
        path: charts/rideshare-service
        helm:
          valueFiles:
            - clusters/production/values/applications/payment-service.yaml
