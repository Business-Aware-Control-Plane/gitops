            - clusters/production/values/applications/trip-service.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: rideshare-prod
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        createNamespace: true

  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: prod-driver-service
      namespace: argocd
    spec:
