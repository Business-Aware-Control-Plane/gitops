apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaeger
  labels:
    app: jaeger
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  ingressClassName: nginx
  rules:
    - host: jaeger.rideshare
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jaeger
                port:
                  number: 16686
